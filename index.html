<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Desmos Multi-Color Grapher</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; color: #eee; max-width: 900px; margin: auto; padding: 20px; }
        .card { background: #2d2d2d; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        canvas { border: 1px solid #444; background: #000; max-width: 100%; height: auto; margin: 10px 0; }
        textarea { width: 100%; height: 200px; background: #111; color: #0f0; border: 1px solid #444; padding: 10px; font-family: 'Courier New', monospace; font-size: 12px; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        input[type="range"] { width: 100%; }
        button { background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #0056b3; }
        .color-tag { display: inline-block; width: 20px; height: 20px; border-radius: 50%; vertical-align: middle; margin-right: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Vẽ đồ thị Desmos Đa Sắc</h2>
    
    <div class="controls">
        <div>
            <label>Chọn ảnh (Nhiều màu/Chi tiết):</label><br>
            <input type="file" id="upload" accept="image/*">
        </div>
        <div>
            <label>Độ chi tiết (Số vòng Fourier): <span id="k-val">30</span></label>
            <input type="range" id="k-slider" min="5" max="150" value="30">
        </div>
    </div>

    <canvas id="canvas"></canvas>
    <button onclick="processImage()">PHÂN TÍCH VÀ TẠO PHÉP TÍCH</button>

    <h3>Kết quả cho Desmos:</h3>
    <div id="results"></div>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const kSlider = document.getElementById('k-slider');
    const kVal = document.getElementById('k-val');
    let originalImage = null;

    kSlider.oninput = () => kVal.innerText = kSlider.value;

    document.getElementById('upload').onchange = function(e) {
        const reader = new FileReader();
        reader.onload = (event) => {
            originalImage = new Image();
            originalImage.onload = () => {
                canvas.width = 400;
                canvas.height = 400;
                ctx.drawImage(originalImage, 0, 0, 400, 400);
            };
            originalImage.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    function processImage() {
        if (!originalImage) return;
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;
        
        // Bước 1: Nhóm các điểm theo màu (Color Clustering đơn giản)
        const groups = {}; // { "r,g,b": [points] }

        for (let y = 0; y < canvas.height; y += 3) {
            for (let x = 0; x < canvas.width; x += 3) {
                const i = (y * canvas.width + x) * 4;
                const r = Math.round(data[i] / 50) * 50; // Làm tròn màu để nhóm
                const g = Math.round(data[i+1] / 50) * 50;
                const b = Math.round(data[i+2] / 50) * 50;
                
                if (r + g + b < 650) { // Bỏ qua màu trắng nền
                    const key = `${r},${g},${b}`;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push({x: x - 200, y: 200 - y});
                }
            }
        }

        renderResults(groups);
    }

    function calculateFourier(points, K) {
        const N = points.length;
        if (N < 10) return null;
        
        let x_terms = [];
        let y_terms = [];

        for (let k = -K; k <= K; k++) {
            let re = 0, im = 0;
            for (let n = 0; n < N; n++) {
                let phi = (2 * Math.PI * k * n) / N;
                re += points[n].x * Math.cos(phi) + points[n].y * Math.sin(phi);
                im += -points[n].x * Math.sin(phi) + points[n].y * Math.cos(phi);
            }
            re /= N; im /= N;
            let amp = Math.sqrt(re*re + im*im);
            let phase = Math.atan2(im, re);
            if (amp > 0.05) {
                x_terms.push(`${amp.toFixed(2)}\\cos(2\\pi \\cdot ${k}t + ${phase.toFixed(2)})`);
                y_terms.push(`${amp.toFixed(2)}\\sin(2\\pi \\cdot ${k}t + ${phase.toFixed(2)})`);
            }
        }
        return { x: x_terms.join('+'), y: y_terms.join('+') };
    }

    function renderResults(groups) {
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = "";
        const K = parseInt(kSlider.value);

        Object.keys(groups).forEach((color, index) => {
            const fourier = calculateFourier(groups[color], K);
            if (!fourier) return;

            const html = `
                <div style="margin-top:20px; border-top:1px solid #444; padding-top:10px;">
                    <span class="color-tag" style="background:rgb(${color})"></span>
                    <b>Lớp màu ${index + 1}: rgb(${color})</b>
                    <textarea readonly>
x_${index}(t) = ${fourier.x}
y_${index}(t) = ${fourier.y}
(x_${index}(t), y_${index}(t))  <-- Màu Desmos: rgb(${color})
                    </textarea>
                </div>
            `;
            resultsDiv.innerHTML += html;
        });
    }
</script>
</body>
</html>
